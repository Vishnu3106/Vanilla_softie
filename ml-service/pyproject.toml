readme = "README.md"
authors = [
    { name = "Maddy19032006", email = "dmadhan580@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "python-multipart>=0.0.32",
